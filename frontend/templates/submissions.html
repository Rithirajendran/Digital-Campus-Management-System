<!DOCTYPE html>
<html>

<head>

<title>Assignment Submissions</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Assignment Submissions</h2>

<table class="table table-bordered">

<tr>
<th>Student</th>
<th>File</th>
<th>Marks</th>
<th>Feedback</th>
<th>Submit</th>
</tr>

{% for s in submissions %}

<tr>

<td>{{ s[1] }}</td>

<td>
<a href="/{{ s[2] }}" target="_blank">
View File
</a>
</td>

<form action="/grade_submission" method="POST">

<input type="hidden" name="submission_id" value="{{ s[0] }}">
<input type="hidden" name="assignment_id" value="{{ assignment_id }}">

<td>
<input type="number" name="marks" class="form-control" value="{{ s[3] }}">
</td>

<td>
<input type="text" name="feedback" class="form-control" value="{{ s[4] }}">
</td>

<td>
<button class="btn btn-success">
Save
</button>
</td>

</form>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
