<!DOCTYPE html>
<html>

<head>

<title>Digital Campus Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
body{
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #4facfe, #00f2fe, #43e97b, #38f9d7);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
    0%{ background-position:0% 50%;}
    50%{ background-position:100% 50%;}
    100%{ background-position:0% 50%;}
}

/* ===== CARD ===== */
.card-box{
    width: 400px;
    padding: 35px;
    border-radius: 20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.15);
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    text-align: center;
    color: white;
}

/* ===== TITLES ===== */
.title{
    font-weight: bold;
    margin-bottom: 10px;
}

.subtitle{
    font-size: 16px;
    margin-bottom: 25px;
    opacity: 0.9;
}

/* ===== BUTTONS ===== */
.role-btn{
    width: 100%;
    margin-bottom: 12px;
    padding: 12px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    transition: 0.3s;
}

.student{ background:#007bff; color:white; }
.staff{ background:#28a745; color:white; }
.admin{ background:#212529; color:white; }

.role-btn:hover{
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* ===== FORM ===== */
.form-control{
    border-radius: 10px;
}

/* Eye icon */
.eye{
    position:absolute;
    right:15px;
    top:10px;
    cursor:pointer;
    color:black;
}

/* ===== HIDE SECTIONS ===== */
#loginForm{
    display:none;
}

</style>

</head>

<body>

<div class="card-box">

<h2 class="title">🎓 Digital Campus</h2>

<!-- ================= ROLE SELECTION ================= -->
<div id="roleSelection">

<p class="subtitle">Select Login Type</p>

<button class="role-btn student" onclick="selectRole('student')">
<i class="fa fa-user-graduate"></i> Student Login
</button>

<button class="role-btn staff" onclick="selectRole('staff')">
<i class="fa fa-chalkboard-teacher"></i> Staff Login
</button>

<button class="role-btn admin" onclick="selectRole('admin')">
<i class="fa fa-user-shield"></i> Admin Login
</button>

</div>

<!-- ================= LOGIN FORM ================= -->
<div id="loginForm">

<h5 id="roleTitle" class="mb-3"></h5>

<form method="POST" action="/login">

<input type="hidden" name="role" id="roleInput">

<div class="mb-3">
<input type="text" name="email" class="form-control" placeholder="Email" required>
</div>

<div class="mb-3 position-relative">
<input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
<i class="fa fa-eye eye" onclick="togglePassword()"></i>
</div>

<button class="btn btn-dark w-100">Login</button>

</form>

<br>

<button class="btn btn-light w-100" onclick="goBack()">⬅ Back</button>

</div>

</div>

<!-- ================= JS ================= -->

<script>

/* SELECT ROLE */
function selectRole(role){

    document.getElementById("roleSelection").style.display = "none";
    document.getElementById("loginForm").style.display = "block";

    document.getElementById("roleInput").value = role;
    document.getElementById("roleTitle").innerText = role.toUpperCase() + " LOGIN";
}

/* BACK */
function goBack(){
    document.getElementById("roleSelection").style.display = "block";
    document.getElementById("loginForm").style.display = "none";
}

/* SHOW PASSWORD */
function togglePassword(){
    var pass = document.getElementById("password");

    if(pass.type === "password"){
        pass.type = "text";
    } else {
        pass.type = "password";
    }
}

</script>

</body>
</html>
