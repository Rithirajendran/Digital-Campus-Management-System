<!DOCTYPE html>
<html>

<head>
<title>Enter Student Marks</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(120deg,#eef2ff,#e0f2fe);
}

.card{
    border-radius:15px;
}
</style>

</head>

<body>

<div class="container mt-5">

<div class="card p-4 shadow">

<h3 class="text-center mb-4">📝 Enter Student Marks</h3>

<form action="/add_marks" method="POST">

<!-- SUBJECT -->
<div class="mb-3">
<label>Subject</label>
<select name="subject" class="form-control" required>
    <option value="">-- Select Subject --</option>
    <option>DBMS</option>
    <option>Operating Systems</option>
    <option>Networks</option>
</select>
</div>

<!-- EXAM TYPE -->
<div class="mb-3">
<label>Exam Type</label>
<select name="exam_type" class="form-control" required>
    <option value="">-- Select Exam Type --</option>
    <option>Internal</option>
    <option>Assignment 1</option>
    <option>Assignment 2</option>
    <option>Model Exam</option>
</select>
</div>

<!-- TOTAL -->
<div class="mb-3">
<label>Total Marks</label>
<select name="total_marks" class="form-control" required>
    <option value="">-- Select Total --</option>
    <option>20</option>
    <option>40</option>
    <option>60</option>
    <option>100</option>
</select>
</div>

<!-- STUDENTS TABLE -->
<table class="table table-bordered text-center">

<thead class="table-dark">
<tr>
    <th>Student Name</th>
    <th>Marks</th>
</tr>
</thead>

<tbody>

{% for s in students %}
<tr>
    <td>{{ s[1] }}</td>
    <td>
        <input type="number" name="marks_{{ s[0] }}" class="form-control" placeholder="Enter marks">
    </td>
</tr>
{% endfor %}

</tbody>

</table>

<!-- SAVE BUTTON -->
<div class="text-center">
<button class="btn btn-success px-5">💾 Save All</button>
</div>

</form>

</div>

</div>

</body>
</html>
