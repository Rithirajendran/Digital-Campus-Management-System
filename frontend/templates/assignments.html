<!DOCTYPE html>
<html>
<head>

<title>Assignments</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background: #f4f6f9;
}

.assignment-card {
    border-radius: 15px;
    transition: 0.3s;
}

.assignment-card:hover {
    transform: translateY(-5px);
}

.deadline {
    font-size: 14px;
    color: #dc3545;
}

</style>

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">📚 Assignments</h2>

<div class="row">

{% for a in assignments %}

<div class="col-md-4 mb-4">

<div class="card assignment-card shadow-sm p-3">

<h5 class="mb-2">{{ a[1] }}</h5>

<p class="text-muted">{{ a[3] }}</p>

<p class="deadline">
    ⏰ Deadline: {{ a[4] }}
</p>

<hr>

<form action="/submit_assignment" method="POST" enctype="multipart/form-data">

<input type="hidden" name="assignment_id" value="{{ a[0] }}">
<input type="hidden" name="student_id" value="{{ student_id }}">

<input type="file" name="file" class="form-control mb-2" required>

<button class="btn btn-success w-100">
    ⬆ Upload Assignment
</button>

</form>

</div>

</div>

{% endfor %}

</div>

<div class="text-center mt-4">
<a href="/student_dashboard/{{ student_id }}" class="btn btn-dark">
← Back to Dashboard
</a>
</div>

</div>

</body>
</html>
