<!DOCTYPE html>
<html>
<head>
<title>Chat</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: #e5ddd5;
}

/* CHAT CONTAINER */
.chat-container{
    max-width: 700px;
    margin: auto;
    margin-top: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    overflow: hidden;
}

/* HEADER */
.chat-header{
    background: #075e54;
    color: white;
    padding: 15px;
    font-weight: bold;
}

/* CHAT BOX */
.chat-box{
    height: 450px;
    overflow-y: auto;
    padding: 15px;
    background: #efeae2;
}

/* MESSAGE COMMON */
.msg{
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 10px;
    max-width: 65%;
    position: relative;
    animation: fadeIn 0.3s ease;
}

/* STUDENT (RIGHT - BLUE) */
.student{
    background: #dcf8c6;
    margin-left: auto;
}

/* STAFF (LEFT - WHITE) */
.staff{
    background: white;
}

/* BROADCAST */
.broadcast{
    background: #ffe082;
    text-align: center;
    margin: auto;
}

/* TIME */
.time{
    font-size: 10px;
    color: gray;
    margin-top: 5px;
    text-align: right;
}

/* INPUT */
.chat-input{
    padding: 10px;
    background: #f0f0f0;
}

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform: translateY(5px);}
    to{opacity:1; transform: translateY(0);}
}

</style>

</head>

<body>

<div class="chat-container">

<!-- HEADER -->
<div class="chat-header">
    💬 Chat with Student (ID: {{ student_id }})
</div>

<div class="chat-box mb-3">

{% for m in messages %}

    {% if m[3] == 'broadcast' %}
        <div class="msg broadcast text-center">
            {{ m[1] }}
            <div class="time">{{ m[2] }}</div>
        </div>

    {% elif m[0] == 'staff' %}
        <!-- RIGHT SIDE -->
        <div class="d-flex justify-content-end">
            <div class="msg staff-msg">
                {{ m[1] }}
                <div class="time text-end">{{ m[2] }}</div>
            </div>
        </div>

    {% elif m[0] == 'student' %}
        <!-- LEFT SIDE -->
        <div class="d-flex justify-content-start">
            <div class="msg student-msg">
                {{ m[1] }}
                <div class="time">{{ m[2] }}</div>
            </div>
        </div>

    {% endif %}

{% endfor %}

</div>

<!-- INPUT -->
<form method="POST" action="/staff_chat/{{ staff_id }}/{{ student_id }}" class="chat-input">

<div class="input-group">
    <input type="text" name="message" class="form-control" placeholder="Type a message..." required>
    <button class="btn btn-success">Send</button>
</div>

</form>

</div>

<!-- AUTO SCROLL -->
<script>
let chatBox = document.getElementById("chatBox");
chatBox.scrollTop = chatBox.scrollHeight;
</script>

</body>
</html>
