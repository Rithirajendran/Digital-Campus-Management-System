<!DOCTYPE html>
<html>

<head>

<title>AI Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

.card{
    border-radius: 15px;
}

</style>

</head>

<body>

<div class="container mt-5 text-center">

<h2>🤖 Student Performance Prediction</h2>

<div class="card p-4 mt-4 shadow">

<h5>Attendance: <b>{{ attendance }}%</b></h5>
<h5>Average Marks: <b>{{ marks }}</b></h5>

<hr>

{% if result == "Pass" %}

<h3 class="text-success">Prediction: PASS ✅</h3>

<p class="text-success">You are performing well. Keep it up!</p>

{% else %}

<h3 class="text-danger">Prediction: FAIL ❌</h3>

<p class="text-danger">You need improvement. Focus on attendance and marks.</p>

{% endif %}

</div>


<!-- ================= GRAPH ================= -->

<h4 class="mt-5">Performance Analysis</h4>

<canvas id="predictionChart" style="max-width:400px;margin:auto;"></canvas>



</div>

</body>
</html>
